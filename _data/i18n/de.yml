home:
  title: "Fällig? Sie wissen es vorher."
  sub: "Motoor hält Wartungserinnerungen, Tankfüllungen, Kosten und die Historie für Ihr Auto, Motorrad oder Fahrrad an einem Ort fest. Fügen Sie ein Fahrzeug hinzu, und Motoor erstellt den Wartungsplan für Sie. Das dauert etwa eine Minute."
