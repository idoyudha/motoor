  features_sub: "Keine Tabellen, kein Schuhkarton voller Belege. Einmal eintragen, Motoor rechnet für Sie."
  f1_title: "Was zuerst eintritt"
  f1_text: "Jede Erinnerung läuft nach Strecke und nach Datum und meldet sich bei dem, was zuerst eintritt. Überfällig, bald fällig und anstehend steht immer als Text da, nie nur als Farbe."
  f2_title: "Tanken und Laden"
  f2_text: "Erfassen Sie jede Tankfüllung mit wenigen Tipps. Motoor berechnet Ihren Verbrauch und was jede Füllung kostet."
