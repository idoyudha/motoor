home:
  title: "Biết việc cần làm, trước hạn."
  sub: "Motoor lưu nhắc nhở bảo dưỡng, nhiên liệu, chi phí và lịch sử của ô tô, xe máy hoặc xe đạp của bạn ở cùng một nơi. Thêm một chiếc xe và Motoor sẽ lập lịch bảo dưỡng cho bạn. Chỉ mất khoảng một phút."
