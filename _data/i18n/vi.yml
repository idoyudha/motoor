  features_title: "Mọi thứ trong một sổ"
  features_sub: "Không cần bảng tính, không cần hộp đựng hóa đơn. Ghi một lần, Motoor sẽ lo phần tính toán."
  f1_title: "Mốc nào đến trước"
  f1_text: "Mỗi nhắc nhở theo dõi cả quãng đường lẫn ngày, và báo theo mốc nào đến trước. Quá hạn, sắp đến hạn và sắp tới luôn được ghi bằng chữ, không bao giờ chỉ bằng màu."
  f2_title: "Nhiên liệu và sạc điện"
  f2_text: "Ghi lại mỗi lần đổ xăng chỉ với vài lần chạm. Motoor tính mức tiêu hao và chi phí của mỗi lần đổ."
  f3_title: "Chi phí được cộng dồn rõ ràng"
  f3_text: "Bảo dưỡng, phụ tùng, thuế, gửi xe và bảo hiểm, tất cả ở cùng một nơi. Xem mỗi chiếc xe thực sự tốn bao nhiêu mỗi dặm hoặc mỗi tháng."
  f4_title: "Lịch sử bảo dưỡng đầy đủ"
  f4_text: "Mỗi lần bảo dưỡng đều có ngày, số odo, garage và ảnh. Hữu ích cho lần bảo dưỡng tiếp theo và khi bạn bán xe."
  classes_title: "Lịch bảo dưỡng cho mọi xe"
  classes_sub: "Mỗi loại xe có lịch bảo dưỡng hợp lý riêng. Xe đạp được tính theo thời gian sử dụng thay vì số odo."
