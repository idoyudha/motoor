home:
  title: "Know what’s due, before it’s due."
  sub: "Motoor keeps service reminders, fuel, costs and history for your car, motorcycle or bicycle in one place. Add a vehicle and Motoor sets up the service schedule for you. It takes about a minute."
  get_it_on: "Get it on"
  download_on: "Download on the"
  coming_soon: "Coming soon"
  fine: "Free to start · Backed up automatically · Works offline"
  features_title: "Everything in one logbook"
  features_sub: "No spreadsheets, no shoebox of receipts. Log it once and Motoor does the counting."
  f1_title: "Whichever comes first"
  f1_text: "Every reminder runs by distance and by date, and fires on whichever comes first. Overdue, due soon and upcoming are always spelled out, never shown by color alone."
  f2_title: "Fuel and charging"
  f2_text: "Log each fill in a few taps. Motoor works out your consumption and what each fill costs you."
  f3_title: "Costs that add up"
  f3_text: "Service, parts, tax, parking and insurance, all in one place. See what each vehicle really costs per mile or per month."
  f4_title: "Full service history"
  f4_text: "Every service with its date, odometer, workshop and photos. Useful at the next service, and when you sell."
  classes_title: "A schedule for every vehicle"
  classes_sub: "Each class gets its own sensible service schedule. Bicycles are measured by time in service instead of odometer."
