home:
  title: "جانیں کیا واجب ہے، وقت سے پہلے۔"
  sub: "Motoor آپ کی کار، موٹر سائیکل یا سائیکل کے سروس ریمائنڈر، ایندھن، اخراجات اور ریکارڈ ایک ہی جگہ رکھتا ہے۔ گاڑی شامل کریں اور Motoor آپ کے لیے سروس کا شیڈول ترتیب دے دیتا ہے۔ اس میں تقریباً ایک منٹ لگتا ہے۔"
  get_it_on: "حاصل کریں"
  download_on: "ڈاؤن لوڈ کریں"
  coming_soon: "جلد آ رہا ہے"
  fine: "مفت شروع کریں · خودکار بیک اپ · آف لائن بھی چلتا ہے"
  features_title: "سب کچھ ایک لاگ بک میں"
  features_sub: "نہ اسپریڈشیٹ، نہ رسیدوں کا ڈھیر۔ ایک بار درج کریں، حساب Motoor لگاتا ہے۔"
  f1_title: "جو پہلے آئے"
  f1_text: "ہر یاد دہانی فاصلے اور تاریخ دونوں سے چلتی ہے، اور جو پہلے آئے اسی پر بتاتی ہے۔ تاخیر شدہ، جلد واجب اور آنے والا ہمیشہ لفظوں میں لکھا ہوتا ہے، صرف رنگ سے کبھی نہیں۔"
  f2_title: "ایندھن اور چارجنگ"
  f2_text: "ہر بار ٹنکی بھروانے کو چند ٹیپ میں درج کریں۔ Motoor آپ کی ایندھن کی کھپت اور ہر بار کا خرچ نکال دیتا ہے۔"
  f3_title: "سارے اخراجات کا پورا حساب"
  f3_text: "سروس، پرزے، ٹیکس، پارکنگ اور انشورنس، سب ایک جگہ۔ دیکھیں کہ ہر گاڑی پر اصل میں فی میل یا فی مہینہ کتنا خرچ آتا ہے۔"
  f4_title: "مکمل سروس ریکارڈ"
  f4_text: "ہر سروس اپنی تاریخ، اوڈومیٹر، ورکشاپ اور تصاویر کے ساتھ۔ اگلی سروس پر بھی کام آتا ہے، اور گاڑی بیچتے وقت بھی۔"
  classes_title: "ہر گاڑی کے لیے شیڈول"
  classes_sub: "ہر قسم کی گاڑی کو اس کے مطابق مناسب سروس شیڈول ملتا ہے۔ سائیکلوں کے لیے اوڈومیٹر کی بجائے استعمال کا وقت گنا جاتا ہے۔"
  car: "کار"
  motorcycle: "موٹر سائیکل"
