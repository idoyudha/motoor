  private_text: "آپ کی لاگ بک آپ کے فون پر رہتی ہے اور آپ کے اکاؤنٹ میں بیک اپ ہوتی ہے، اس لیے نیا فون وہیں سے شروع کرتا ہے جہاں پرانا چھوڑا تھا۔ کوئی اشتہار نہیں، کبھی بیچا نہیں جاتا، اور آپ جب چاہیں سب کچھ حذف کر سکتے ہیں۔"
