home:
  eyebrow: "Buku catatan kendaraan · Android dan iOS"
  title: "Ketahui kebutuhan kendaraan Anda, sebelum waktunya tiba."
  sub: "Motoor menyimpan pengingat servis, bahan bakar, biaya, dan riwayat mobil, motor, atau sepeda Anda di satu tempat. Tambahkan kendaraan dan Motoor akan menyiapkan jadwal servisnya untuk Anda. Hanya butuh sekitar satu menit."
  get_it_on: "Dapatkan di"
  download_on: "Unduh di"
  coming_soon: "Segera hadir"
  fine: "Gratis untuk memulai · Dicadangkan otomatis · Bisa dipakai offline"
  features_eyebrow: "Yang dilakukan Motoor"
  features_title: "Satu buku catatan untuk semua kendaraan Anda"
  features_sub: "Tanpa spreadsheet, tanpa tumpukan struk. Catat sekali, dan Motoor yang menghitung."
  f1_title: "Pengingat servis"
  f1_text: "Pengingat berdasarkan jarak atau tanggal, mana yang lebih dulu. Motoor memberi tahu apa yang sudah terlambat, apa yang segera jatuh tempo, dan apa yang masih bisa menunggu."
  f2_title: "Bahan bakar dan pengisian daya"
  f2_text: "Catat setiap pengisian dengan beberapa ketukan. Motoor menghitung konsumsi bahan bakar Anda dan biaya setiap pengisian."
  f3_title: "Biaya yang tercatat rapi"
  f3_text: "Servis, suku cadang, pajak, parkir, dan asuransi, semuanya di satu tempat. Lihat berapa sebenarnya biaya setiap kendaraan per mil atau per bulan."
  f4_title: "Riwayat servis lengkap"
  f4_text: "Setiap servis lengkap dengan tanggal, odometer, bengkel, dan fotonya. Berguna saat servis berikutnya, dan saat Anda menjual kendaraan."
  status_eyebrow: "Pengingat"
  status_title: "Lihat sekilas apa yang perlu diperhatikan"
  status_sub: "Setiap pengingat memiliki status yang jelas. Keterangannya selalu tertulis, jadi Anda tidak perlu menebak dari warna."
  no_reminders: "Tidak ada pengingat"
  example_label: "Contoh pengingat"
  ex1_meta: "Trident 660 · setiap 10.000 mi"
  ex2_meta: "RAV4 · 3 minggu lagi"
  ex3_meta: "RAV4 · 4 bulan lagi · $82"
  ex4_meta: "Trident 660 · setiap 500 mi"
  classes_eyebrow: "Dibuat untuk"
  classes_title: "Mobil, motor, sepeda, dan mobil listrik"
  classes_sub: "Setiap jenis kendaraan punya jadwal servisnya sendiri yang masuk akal. Sepeda diukur berdasarkan lama pemakaian, bukan odometer."
  car: "Mobil"
  motorcycle: "Motor"
  bicycle: "Sepeda"
  ev: "Mobil listrik"
  evmoto: "Motor listrik"
  private_title: "Dicadangkan, dan tetap privat"
  private_text: "Buku catatan Anda tersimpan di ponsel dan dicadangkan ke akun Anda, jadi ponsel baru bisa melanjutkan dari ponsel lama. Tanpa iklan, tidak pernah dijual, dan Anda bisa menghapus semuanya kapan saja."
