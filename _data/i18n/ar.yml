home:
  eyebrow: "سجلّ المركبة · Android وiOS"
  title: "اعرف ما تحتاجه مركبتك قبل أن تحتاجه."
  sub: "يحفظ Motoor تذكيرات الصيانة والوقود والتكاليف والسجل الكامل لسيارتك أو دراجتك النارية أو دراجتك الهوائية في مكان واحد. أضف مركبة وسيُعدّ Motoor جدول الصيانة لك. لا يستغرق الأمر سوى دقيقة تقريبًا."
  get_it_on: "احصل عليه من"
  download_on: "نزّله من"
  coming_soon: "قريبًا"
  fine: "ابدأ مجانًا · نسخ احتياطي تلقائي · يعمل دون اتصال"
  features_eyebrow: "ما يقدّمه Motoor"
  features_title: "سجلّ واحد لكل ما تقوده وتركبه"
  features_sub: "لا جداول بيانات ولا صناديق مليئة بالإيصالات. سجّل مرة واحدة ودَع Motoor يتولّى الحساب."
  f1_title: "تذكيرات الصيانة"
  f1_text: "تذكيرات حسب المسافة أو حسب التاريخ، أيهما يأتي أولًا. يخبرك Motoor بما تأخّر وما اقترب موعده وما يمكنه الانتظار."
  f2_title: "الوقود والشحن"
  f2_text: "سجّل كل تعبئة ببضع نقرات. يحسب Motoor معدل استهلاكك وتكلفة كل تعبئة."
  f3_title: "تكاليف تُحسب بدقة"
  f3_text: "الصيانة وقطع الغيار والضرائب ومواقف السيارات والتأمين، كلها في مكان واحد. اعرف التكلفة الحقيقية لكل مركبة لكل ميل أو لكل شهر."
  f4_title: "سجل صيانة كامل"
  f4_text: "كل صيانة مع تاريخها وقراءة العدّاد والورشة والصور. مفيد في الصيانة التالية، وعند البيع."
  status_eyebrow: "التذكيرات"
  status_title: "اعرف بنظرة واحدة ما يحتاج إلى اهتمامك"
  status_sub: "لكل تذكير حالة واضحة. الحالة مكتوبة دائمًا بالكلمات، فلا تضطر أبدًا إلى تخمينها من اللون."
  no_reminders: "لا توجد تذكيرات"
  example_label: "أمثلة على التذكيرات"
  ex1_meta: "Trident 660 · كل 10,000 mi"
  ex2_meta: "RAV4 · بعد 3 أسابيع"
  ex3_meta: "RAV4 · بعد 4 أشهر · $82"
  ex4_meta: "Trident 660 · كل 500 mi"
  classes_eyebrow: "مصمَّم لـ"
  classes_title: "السيارات والدراجات النارية والدراجات الهوائية والسيارات الكهربائية"
  classes_sub: "تحصل كل فئة على جدول صيانة مناسب لها. وتُقاس الدراجات الهوائية بمدة الاستخدام بدلًا من العدّاد."
  car: "سيارة"
