  bicycle: "دراجة هوائية"
  ev: "سيارة كهربائية"
  evmoto: "دراجة نارية كهربائية"
  private_title: "نسخ احتياطي وخصوصية"
  private_text: "يبقى سجلّك على هاتفك ويُنسخ احتياطيًا إلى حسابك، فيكمل هاتفك الجديد من حيث توقّف القديم. لا إعلانات، ولا بيع لبياناتك أبدًا، ويمكنك حذف كل شيء متى شئت."
  private_link: "اقرأ سياسة الخصوصية"
  person_title: "يردّ عليك شخص حقيقي"
