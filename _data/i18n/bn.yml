  private_text: "আপনার লগবুক থাকে আপনার ফোনে এবং ব্যাকআপ হয় আপনার অ্যাকাউন্টে, তাই নতুন ফোন ঠিক সেখান থেকে শুরু করে যেখানে পুরোনোটি থেমেছিল। কোনো বিজ্ঞাপন নেই, কখনো বিক্রি করা হয় না, আর আপনি যখন খুশি সব মুছে ফেলতে পারেন।"
  private_link: "গোপনীয়তা নীতি পড়ুন"
  person_text: "Motoor তৈরি করেন একজন স্বাধীন ডেভেলপার। প্রশ্ন আর আইডিয়া সরাসরি তাঁর কাছে যায়, এবং উত্তর আসে %time%।"
  person_link: "সহায়তা নিন"
  classes_note: "এগুলো উদাহরণ। Motoor প্রতিটি সময়সূচি মেক ও পাওয়ারট্রেন অনুযায়ী সাজায়, আর যা লাগবে না তা বাদ দিতে পারেন। Premium-এ ব্যবধান বদলাতে ও নিজের আইটেম যোগ করতে পারবেন।"
