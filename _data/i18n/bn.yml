  private_text: "আপনার লগবুক থাকে আপনার ফোনে এবং ব্যাকআপ হয় আপনার অ্যাকাউন্টে, তাই নতুন ফোন ঠিক সেখান থেকে শুরু করে যেখানে পুরোনোটি থেমেছিল। কোনো বিজ্ঞাপন নেই, কখনো বিক্রি করা হয় না, আর আপনি যখন খুশি সব মুছে ফেলতে পারেন।"
