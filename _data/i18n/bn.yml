home:
  title: "কী বাকি, সময়ের আগেই জানুন।"
  sub: "Motoor আপনার গাড়ি, মোটরসাইকেল বা সাইকেলের সার্ভিস রিমাইন্ডার, জ্বালানি, খরচ ও ইতিহাস এক জায়গায় রাখে। একটি যানবাহন যোগ করুন, Motoor আপনার জন্য সার্ভিসের সময়সূচি তৈরি করে দেবে। এতে মোটামুটি এক মিনিট লাগে।"
  get_it_on: "পাওয়া যাচ্ছে"
  download_on: "ডাউনলোড করুন"
  coming_soon: "শীঘ্রই আসছে"
  fine: "শুরু করুন বিনামূল্যে · স্বয়ংক্রিয় ব্যাকআপ · অফলাইনেও চলে"
  features_title: "সবকিছু এক লগবুকে"
  features_sub: "স্প্রেডশিট লাগবে না, রসিদের স্তূপও না। একবার লিখে রাখুন, হিসাব করবে Motoor।"
  f1_title: "যেটা আগে আসে"
  f1_text: "প্রতিটি রিমাইন্ডার দূরত্ব ও তারিখ দুটোই দেখে, আর যেটা আগে আসে সেটাতেই জানায়। মেয়াদোত্তীর্ণ, শীঘ্রই এবং আসন্ন সবসময় লেখায় দেখানো হয়, কখনো শুধু রঙে নয়।"
  f2_title: "জ্বালানি ও চার্জিং"
  f2_text: "প্রতিবার তেল ভরার হিসাব কয়েকটি ট্যাপেই লিখে রাখুন। Motoor আপনার জ্বালানি খরচের হার আর প্রতিবার কত খরচ হলো তা বের করে দেয়।"
  f3_title: "সব খরচের পুরো হিসাব"
  f3_text: "সার্ভিস, যন্ত্রাংশ, ট্যাক্স, পার্কিং ও বিমা, সব এক জায়গায়। দেখুন প্রতিটি যানবাহনের আসল খরচ প্রতি মাইলে বা প্রতি মাসে কত।"
  f4_title: "সম্পূর্ণ সার্ভিস ইতিহাস"
  f4_text: "প্রতিটি সার্ভিস, তার তারিখ, ওডোমিটার, ওয়ার্কশপ আর ছবিসহ। পরের সার্ভিসের সময় কাজে লাগে, বিক্রির সময়ও।"
  classes_title: "প্রতিটি যানবাহনের জন্য সময়সূচি"
  classes_sub: "প্রতিটি ধরনের যানবাহন পায় নিজের উপযোগী সার্ভিস সময়সূচি। সাইকেলের ক্ষেত্রে ওডোমিটারের বদলে ব্যবহারের সময় ধরে হিসাব হয়।"
