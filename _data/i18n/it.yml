home:
  title: "Sai cosa scade, prima che scada."
  sub: "Motoor raccoglie in un unico posto promemoria di manutenzione, carburante, spese e storico della tua auto, moto o bicicletta. Aggiungi un veicolo e Motoor imposta per te il piano di manutenzione. Ci vuole circa un minuto."
  get_it_on: "Disponibile su"
  download_on: "Scarica su"
  coming_soon: "Prossimamente"
  fine: "Gratis per iniziare · Backup automatico · Funziona offline"
  features_title: "Tutto in un solo libretto"
  features_sub: "Niente fogli di calcolo, niente scatole piene di scontrini. Registra una volta e Motoor fa i conti."
  f1_title: "Quello che arriva prima"
  f1_text: "Ogni promemoria segue la distanza e la data, e scatta con quello che arriva prima. Scaduto, in scadenza e in arrivo sono sempre scritti per esteso, mai indicati solo dal colore."
  f2_title: "Carburante e ricarica"
  f2_text: "Registra ogni rifornimento con pochi tocchi. Motoor calcola i tuoi consumi e quanto ti costa ogni rifornimento."
  f3_title: "Spese sotto controllo"
  f3_text: "Manutenzione, ricambi, bollo, parcheggio e assicurazione, tutto in un unico posto. Scopri quanto costa davvero ogni veicolo al miglio o al mese."
  f4_title: "Storico completo degli interventi"
  f4_text: "Ogni intervento con data, contachilometri, officina e foto. Utile al prossimo tagliando e quando vendi."
  classes_title: "Un piano per ogni veicolo"
  classes_sub: "Ogni categoria ha il suo piano di manutenzione su misura. Le biciclette si misurano in tempo di utilizzo invece che col contachilometri."
  car: "Auto"
  motorcycle: "Moto"
  bicycle: "Bicicletta"
  ev: "Auto elettrica"
  evmoto: "Moto elettrica"
  private_text: "Il tuo libretto vive sul telefono e viene salvato sul tuo account, così un telefono nuovo riprende da dove si era fermato quello vecchio. Niente pubblicità, mai venduto, e puoi eliminare tutto quando vuoi."
  private_link: "Leggi l’informativa sulla privacy"
  person_text: "Motoor è realizzato da un unico sviluppatore indipendente. Domande e idee arrivano direttamente a lui, e ricevi una risposta %time%."
  person_link: "Chiedi assistenza"
  classes_note: "Sono esempi. Motoor adatta ogni piano alla marca e all’alimentazione, e puoi togliere ciò che non ti serve. Con Premium cambi gli intervalli e aggiungi i tuoi."
