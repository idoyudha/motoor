home:
  eyebrow: "वाहन लॉगबुक · Android और iOS"
  title: "जानिए आपके वाहन को क्या चाहिए, ज़रूरत पड़ने से पहले।"
  sub: "Motoor आपकी कार, मोटरसाइकिल या साइकिल के सर्विस रिमाइंडर, ईंधन, खर्च और इतिहास को एक ही जगह रखता है। वाहन जोड़ें और Motoor आपके लिए सर्विस शेड्यूल तैयार कर देता है। इसमें लगभग एक मिनट लगता है।"
  get_it_on: "इस पर पाएँ"
  download_on: "यहाँ से डाउनलोड करें"
  coming_soon: "जल्द आ रहा है"
  fine: "शुरुआत मुफ़्त · अपने-आप बैकअप · ऑफ़लाइन भी काम करता है"
  features_eyebrow: "Motoor क्या करता है"
  features_title: "आपके हर वाहन के लिए एक लॉगबुक"
  features_sub: "न स्प्रेडशीट, न रसीदों का ढेर। एक बार दर्ज करें, बाकी हिसाब Motoor लगाता है।"
  f1_title: "सर्विस रिमाइंडर"
  f1_text: "दूरी या तारीख के हिसाब से रिमाइंडर, जो भी पहले आए। Motoor बताता है कि किसका समय निकल चुका है, क्या जल्द ज़रूरी है और क्या बाद में हो सकता है।"
  f2_title: "ईंधन और चार्जिंग"
  f2_text: "हर बार ईंधन भरवाने को कुछ ही टैप में दर्ज करें। Motoor आपकी ईंधन खपत और हर बार का खर्च निकाल देता है।"
  f3_title: "पूरा खर्च, एक नज़र में"
  f3_text: "सर्विस, पार्ट्स, टैक्स, पार्किंग और बीमा, सब एक जगह। देखें कि हर वाहन पर असल में प्रति मील या प्रति महीना कितना खर्च होता है।"
  f4_title: "पूरी सर्विस हिस्ट्री"
  f4_text: "हर सर्विस, उसकी तारीख, ओडोमीटर, वर्कशॉप और फ़ोटो के साथ। अगली सर्विस के समय भी काम की, और वाहन बेचते समय भी।"
  status_eyebrow: "रिमाइंडर"
  status_title: "एक नज़र में देखें किस पर ध्यान देना है"
  status_sub: "हर रिमाइंडर का साफ़ स्टेटस होता है। स्टेटस हमेशा शब्दों में लिखा होता है, इसलिए आपको सिर्फ़ रंग देखकर अंदाज़ा नहीं लगाना पड़ता।"
  no_reminders: "कोई रिमाइंडर नहीं"
  example_label: "रिमाइंडर के उदाहरण"
  ex1_meta: "Trident 660 · हर 10,000 mi पर"
  ex2_meta: "RAV4 · 3 हफ़्ते में"
  ex3_meta: "RAV4 · 4 महीने में · $82"
  ex4_meta: "Trident 660 · हर 500 mi पर"
  classes_eyebrow: "किसके लिए"
  classes_title: "कार, मोटरसाइकिल, साइकिल और इलेक्ट्रिक वाहन"
  classes_sub: "हर तरह के वाहन को उसके हिसाब से सही सर्विस शेड्यूल मिलता है। साइकिल के लिए ओडोमीटर की जगह इस्तेमाल का समय गिना जाता है।"
  car: "कार"
  motorcycle: "मोटरसाइकिल"
  bicycle: "साइकिल"
  ev: "इलेक्ट्रिक कार"
  evmoto: "इलेक्ट्रिक मोटरसाइकिल"
  private_title: "बैकअप भी, और निजी भी"
  private_text: "आपकी लॉगबुक आपके फ़ोन पर रहती है और आपके अकाउंट में बैकअप होती है, ताकि नया फ़ोन वहीं से शुरू करे जहाँ पुराना छूटा था। कोई विज्ञापन नहीं, डेटा कभी बेचा नहीं जाता, और आप जब चाहें सब कुछ डिलीट कर सकते हैं।"
  private_link: "गोपनीयता नीति पढ़ें"
  person_title: "जवाब एक असली इंसान देता है"
  person_text: "Motoor को एक स्वतंत्र डेवलपर बनाते हैं। आपके सवाल और सुझाव सीधे उन्हीं तक पहुँचते हैं, और आपको %time% जवाब मिलता है।"
  person_link: "सहायता पाएँ"

