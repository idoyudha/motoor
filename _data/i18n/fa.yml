home:
  title: "سررسیدها را پیش از موعد بدانید."
  sub: "Motoor یادآورهای سرویس، سوخت، هزینه‌ها و سوابق خودرو، موتورسیکلت یا دوچرخهٔ شما را یک‌جا نگه می‌دارد. یک وسیلهٔ نقلیه اضافه کنید تا Motoor برنامهٔ سرویس را برایتان تنظیم کند. حدود یک دقیقه طول می‌کشد."
  get_it_on: "دریافت از"
  download_on: "دانلود از"
  coming_soon: "به‌زودی"
  fine: "شروع رایگان · پشتیبان‌گیری خودکار · کار بدون اینترنت"
  features_title: "همه‌چیز در یک دفترچه"
  features_sub: "نه صفحه‌گسترده، نه جعبه‌ای پر از رسید. یک بار ثبت کنید و حساب‌وکتاب را به Motoor بسپارید."
  f1_title: "هر کدام زودتر برسد"
  f1_text: "هر یادآور هم مسافت و هم تاریخ را دنبال می‌کند و با هر کدام که زودتر برسد خبر می‌دهد. عقب‌افتاده، به‌زودی و پیشِ‌رو همیشه با کلمه نوشته می‌شوند، هرگز فقط با رنگ."
  f2_title: "سوخت و شارژ"
  f2_text: "هر سوخت‌گیری را با چند لمس ثبت کنید. Motoor مصرف شما و هزینهٔ هر سوخت‌گیری را حساب می‌کند."
  f3_title: "هزینه‌ها، دقیق و یک‌جا"
  f3_text: "سرویس، قطعات، مالیات، پارکینگ و بیمه، همه در یک جا. ببینید هر وسیلهٔ نقلیه به‌ازای هر مایل یا هر ماه واقعاً چقدر هزینه دارد."
  f4_title: "سوابق کامل سرویس"
  f4_text: "هر سرویس با تاریخ، کیلومترشمار، تعمیرگاه و عکس‌هایش. در سرویس بعدی به کارتان می‌آید، و هنگام فروش هم."
  classes_title: "برنامه‌ای برای هر وسیلهٔ نقلیه"
  classes_sub: "هر دسته برنامهٔ سرویس مناسب خودش را دارد. دوچرخه‌ها به‌جای کیلومترشمار بر اساس مدت استفاده سنجیده می‌شوند."
