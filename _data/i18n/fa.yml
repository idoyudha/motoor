  private_text: "دفترچهٔ شما روی گوشی‌تان است و در حسابتان پشتیبان‌گیری می‌شود، پس گوشی جدید از همان‌جایی ادامه می‌دهد که گوشی قبلی متوقف شده بود. بدون تبلیغات، هرگز فروخته نمی‌شود و هر وقت بخواهید می‌توانید همه را حذف کنید."
  private_link: "سیاست حفظ حریم خصوصی را بخوانید"
  person_text: "Motoor را یک توسعه‌دهندهٔ مستقل ساخته است. پرسش‌ها و ایده‌های شما مستقیم به دست او می‌رسد و %time% پاسخ می‌گیرید."
  person_link: "دریافت پشتیبانی"
  classes_note: "این‌ها نمونه‌اند. Motoor هر برنامه را با سازنده و نوع پیشرانه تنظیم می‌کند و می‌توانید موارد غیرضروری را بردارید. با Premium می‌توانید فاصله‌ها را تغییر دهید و موارد خودتان را اضافه کنید."
