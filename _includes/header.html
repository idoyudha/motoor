<header class="mt-appbar">
  <div class="mt-wrap mt-appbar__inner">
    <a class="mt-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
      {% include icon.html name="logo" class="mt-brand__mark" %}
      <span class="mt-brand__word">{{ site.title }}</span>
    </a>
    <nav class="mt-nav" aria-label="Main">
      {% for item in site.nav %}
        <a class="mt-nav__link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
